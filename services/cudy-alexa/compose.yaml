services:
  app:
    env_file: .env
    image: ghcr.io/odairb12/cudy-alexa:latest
    pull_policy: always
    network_mode: host
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
