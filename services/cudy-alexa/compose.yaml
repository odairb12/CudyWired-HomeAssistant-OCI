services:
  app:
    env_file: .env
    build: ./app
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
  caddy:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
