x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 550m
    mem_reservation: 350m
    mem_swappiness: 10
    cpus: 0.60
    oom_score_adj: 0
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/homeassistant/config:/config
      - ./custom_components/cudy:/config/custom_components/cudy:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging: *default-logging

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    network_mode: host
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    mem_swappiness: 20
    cpus: 0.15
    oom_score_adj: 50
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Sao_Paulo}
      SERVERURL: ${WG_SERVER_URL:-auto}
      SERVERPORT: ${WG_SERVER_PORT:-51820}
      PEERS: ${WG_PEERS:-cudy}
      INTERNAL_SUBNET: ${WG_INTERNAL_SUBNET:-10.99.0.0}
      ALLOWEDIPS: ${WG_ALLOWED_IPS:-10.99.0.1/32}
      SERVER_ALLOWEDIPS_PEER_cudy: ${HOME_LAN_CIDR:-192.168.50.0/24}
      LOG_CONFS: "false"
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    logging: *default-logging

  cudy-alexa:
    build: ./services/cudy-alexa/app
    container_name: cudy-alexa-app
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    mem_reservation: 64m
    mem_swappiness: 20
    cpus: 0.20
    oom_score_adj: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    env_file:
      - .env
    environment:
      POLICY_PATH: /app/policy.yaml
      SCHEDULE_PATH: /data/guest-schedules.json
      TIME_ZONE: ${TZ:-America/Sao_Paulo}
      HA_TOKEN_FILE: /run/secrets/ha_token
      NODE_OPTIONS: "--max-old-space-size=64"
    volumes:
      - ./services/cudy-alexa/policy.yaml:/app/policy.yaml:ro
      - ${DATA_DIR:-/srv/home-automation}/cudy-alexa/data:/data
      - ${DATA_DIR:-/srv/home-automation}/secrets/ha_token:/run/secrets/ha_token:ro
    depends_on:
      - homeassistant
    logging: *default-logging

  caddy:
    image: caddy:2.11.3-alpine
    container_name: caddy
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 64m
    mem_reservation: 32m
    mem_swappiness: 20
    cpus: 0.10
    oom_score_adj: 150
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./services/cudy-alexa/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/srv/home-automation}/caddy/data:/data
      - ${DATA_DIR:-/srv/home-automation}/caddy/config:/config
    depends_on:
      - cudy-alexa
    logging: *default-logging

  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: portainer
    network_mode: host
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    mem_swappiness: 60
    cpus: 0.10
    oom_score_adj: 400
    command:
      - --http-disabled
      - --bind-https
      - :9443
      - --tunnel-addr
      - 127.0.0.1
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/srv/home-automation}/portainer/data:/data
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    profiles: ["mqtt"]
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m
    mem_swappiness: 50
    cpus: 0.10
    oom_score_adj: 300
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DATA_DIR:-/srv/home-automation}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR:-/srv/home-automation}/mosquitto/log:/mosquitto/log
    logging: *default-logging

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    mem_swappiness: 60
    cpus: 0.20
    oom_score_adj: 350
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/nodered/data:/data
    logging: *default-logging

  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    profiles: ["esphome"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    mem_swappiness: 60
    cpus: 0.20
    oom_score_adj: 350
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/esphome/config:/config
    logging: *default-logging

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    profiles: ["zigbee"]
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 48m
    mem_swappiness: 60
    cpus: 0.15
    oom_score_adj: 350
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/zigbee2mqtt/data:/app/data
    logging: *default-logging
