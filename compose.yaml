x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/homeassistant/config:/config
      - ./custom_components/cudy:/config/custom_components/cudy:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging: *default-logging

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Sao_Paulo}
      SERVERURL: ${WG_SERVER_URL:-auto}
      SERVERPORT: ${WG_SERVER_PORT:-51820}
      PEERS: ${WG_PEERS:-cudy}
      INTERNAL_SUBNET: ${WG_INTERNAL_SUBNET:-10.99.0.0}
      ALLOWEDIPS: ${WG_ALLOWED_IPS:-10.99.0.1/32}
      SERVER_ALLOWEDIPS_PEER_cudy: ${HOME_LAN_CIDR:-192.168.50.0/24}
      LOG_CONFS: "false"
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    logging: *default-logging

  cudy-alexa:
    build: ./services/cudy-alexa/app
    container_name: cudy-alexa-app
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLICY_PATH: /app/policy.yaml
      SCHEDULE_PATH: /data/guest-schedules.json
      TIME_ZONE: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./services/cudy-alexa/policy.yaml:/app/policy.yaml:ro
      - ${DATA_DIR:-/srv/home-automation}/cudy-alexa/data:/data
    depends_on:
      - homeassistant
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    network_mode: host
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./services/cudy-alexa/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/srv/home-automation}/caddy/data:/data
      - ${DATA_DIR:-/srv/home-automation}/caddy/config:/config
    depends_on:
      - cudy-alexa
    logging: *default-logging

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-/srv/home-automation}/portainer/data:/data
    logging: *default-logging

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    profiles: ["mqtt"]
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DATA_DIR:-/srv/home-automation}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR:-/srv/home-automation}/mosquitto/log:/mosquitto/log
    logging: *default-logging

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    profiles: ["automation"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/nodered/data:/data
    logging: *default-logging

  esphome:
    image: ghcr.io/esphome/esphome:stable
    container_name: esphome
    profiles: ["esphome"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/esphome/config:/config
    logging: *default-logging

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    profiles: ["zigbee"]
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/srv/home-automation}/zigbee2mqtt/data:/app/data
    logging: *default-logging
