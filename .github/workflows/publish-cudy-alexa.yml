name: Publish Cudy Alexa image

on:
  push:
    branches: [main, feat/wireguard-host-network]
    paths:
      - 'services/cudy-alexa/**'
      - '.github/workflows/publish-cudy-alexa.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/cudy-alexa/app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cudy-alexa:latest
            ghcr.io/${{ github.repository_owner }}/cudy-alexa:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Alexa Custom Skill backend for Cudy WR3000
